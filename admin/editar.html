<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Editar · Panel de Tecnifem</title>
<link rel="icon" href="../assets/icono-tecnifem.png">
<style>
/* Botones propios del panel, encima del editor */
.tf-ayuda{position:fixed;left:16px;bottom:16px;z-index:9999;display:flex;gap:8px;font:600 14px/1 system-ui,-apple-system,"Segoe UI",sans-serif}
.tf-ayuda a{display:inline-flex;align-items:center;gap:6px;padding:11px 14px;border-radius:999px;text-decoration:none;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.tf-ayuda .vol{background:#002050;color:#fff}
.tf-ayuda .ver{background:#fff;color:#002050;border:1px solid #c9d6e6}
.tf-ayuda .wa{background:#1f9d57;color:#fff}
@media (max-width:640px){.tf-ayuda .ver,.tf-ayuda .wa{display:none}}
</style>
</head>
<body>
<div class="tf-ayuda">
  <a class="vol" href="./">← Inicio del panel</a>
  <a class="ver" href="../" target="_blank" rel="noopener">Ver mi página</a>
  <a class="wa" href="https://wa.me/56974479565?text=Hola%20Agust%C3%ADn%2C%20necesito%20ayuda%20con%20el%20panel%20de%20Tecnifem" target="_blank" rel="noopener">¿Ayuda?</a>
</div>
<!-- Editor (Decap CMS). La configuración está en admin/config.yml. -->
<script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"></script>
<script>
// Traduce los textos que Decap deja en inglés (por ejemplo «Add producto» → «Agregar producto»).
(function () {
  var T = [[/^Add (.+)$/, "Agregar $1"], [/^Delete$/, "Borrar"], [/^Choose an image$/, "Elegir una imagen"], [/^Choose different image$/, "Elegir otra imagen"], [/^Remove image$/, "Quitar imagen"], [/^Upload$/, "Subir"]];
  function traducir(n) {
    if (n.nodeType !== 3 || !n.nodeValue.trim()) return;
    var v = n.nodeValue.trim();
    for (var i = 0; i < T.length; i++) if (T[i][0].test(v)) { n.nodeValue = n.nodeValue.replace(v, v.replace(T[i][0], T[i][1])); return; }
  }
  function recorrer(raiz) { var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT), n; while ((n = w.nextNode())) traducir(n); }
  new MutationObserver(function (ms) { ms.forEach(function (m) { m.addedNodes.forEach(function (n) { n.nodeType === 3 ? traducir(n) : n.nodeType === 1 && recorrer(n); }); if (m.type === "characterData") traducir(m.target); }); })
    .observe(document.documentElement, { childList: true, subtree: true, characterData: true });
})();
</script>
</body>
</html>
